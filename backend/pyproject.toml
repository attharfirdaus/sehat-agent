[project]
name = "sehatagent-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.1",
    "fastapi==0.163.1",
    "httpx==0.28.1",
    "joblib==1.6.0",
    "langchain-ollama==1.1.0",
    "langgraph==1.2.22",
    "langgraph-checkpoint-postgres==3.2.1",
    "matplotlib==3.11.2",
    "numpy==2.5.5",
    "pandas==3.1.1",
    "pgvector==0.5.1",
    "psycopg[binary,pool]==3.3.9",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "pyjwt==2.15.1",
    "pypdf==7.1.1",
    "pyyaml==6.0.4",
    "scikit-learn==1.9.1",
    "shap==0.54.1",
    "sqlalchemy[asyncio]==2.1.9",
    "sse-starlette==3.7.0",
    "trafilatura==2.3.1",
    "ucimlrepo==0.0.7",
    "uvicorn==0.54.0",
    "xgboost==3.4.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
]
